server {
    listen 443 ssl;
    server_name tv.example.com;

    root /opt/perptv/station;
    add_header Access-Control-Allow-Origin *;

    location / {
        try_files $uri $uri/ /playlist.m3u8;
    }

    location /media/ {
        alias /opt/perptv/station/media/;
    }

    location /billing/ {
        proxy_pass http://127.0.0.1:8088/;
    }
}
